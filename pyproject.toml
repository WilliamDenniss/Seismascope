[project]
name = "quakeagent"
version = "0.1.0"
description = "A stateful Google ADK agent for USGS earthquake feeds and world maps."
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.22,<1",
    "google-adk[db]==2.8.0",
    "httpx>=0.28,<0.29",
    "pillow>=11.3,<12",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.4,<2",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
